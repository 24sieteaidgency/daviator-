<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar Pista en Vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: mapa a pantalla completa; panel lateral tipo "strip" de controlador (abajo en celular) */
:root{
  --bg:#0d1117; --panel:#141a23; --line:#253041; --fg:#e6edf3; --muted:#8b98a9;
  --accent:#f5b700; --ok:#3ccf91; --warn:#ff6b4a;
  --display:"Chakra Petch",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--panel)}
h1{font:700 18px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:10px}
h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}}
@media (prefers-reduced-motion:reduce){h1 .dot{animation:none}}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{font:600 13px/1 var(--display);letter-spacing:.05em;color:var(--muted);background:transparent;border:1px solid var(--line);padding:9px 12px;border-radius:6px;cursor:pointer}
nav button[aria-pressed="true"]{color:#111;background:var(--accent);border-color:var(--accent)}
nav button:focus-visible,a:focus-visible,li button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{margin-left:auto;font:12px var(--mono);color:var(--muted)}
#map{min-height:0}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.apt{font:600 20px/1.15 var(--display);margin:0}
.apt small{display:block;font:12px var(--mono);color:var(--muted);margin-top:4px;letter-spacing:.04em}
.listen{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.listen a{color:var(--fg);text-decoration:none;display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.listen a span{font-family:var(--mono);color:var(--accent)}
.listen a:hover{border-color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
#detail[hidden]{display:none}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;margin-top:10px}
.kv div{min-width:0}
.kv b{display:block;font:500 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kv span{font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.cs{font:700 24px/1 var(--mono);color:var(--accent)}
ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
li button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
li button:hover,li button[aria-current="true"]{background:#1b2330}
li .c{font:600 14px var(--mono)}
li .t{font-size:12px;color:var(--muted)}
li .a{font:500 13px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
li .d{font:12px var(--mono);color:var(--muted);text-align:right}
.gnd{color:var(--ok)}
.empty{padding:16px;color:var(--muted)}
.plane{width:26px;height:26px;cursor:pointer;transition:transform .9s linear}
.plane svg{width:100%;height:100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.plane.sel svg path{fill:var(--accent)}
.lbl{font:600 11px var(--mono);color:#fff;background:rgba(13,17,23,.8);padding:1px 5px;border-radius:3px;white-space:nowrap;pointer-events:none;transform:translate(16px,-4px)}
@media (max-width:820px){
  body{grid-template-columns:1fr;grid-template-rows:auto 55vh 1fr}
  aside{border-left:0;border-top:1px solid var(--line)}
  .status{margin-left:0;width:100%}
}
</style>
</head>
<body>
<header>
  <h1><span class="dot" aria-hidden="true"></span>Radar Pista en Vivo</h1>
  <nav aria-label="Aeropuerto">
    <button type="button" data-apt="MDE" aria-pressed="true">MDE · Rionegro</button>
    <button type="button" data-apt="EOH">EOH · Olaya Herrera</button>
    <button type="button" data-apt="BOG">BOG · El Dorado</button>
  </nav>
  <p class="status" id="status" role="status">Conectando…</p>
</header>

<div id="map" aria-label="Mapa de tráfico aéreo"></div>

<aside>
  <section class="sec">
    <p class="eyebrow">Aeropuerto</p>
    <h2 class="apt" id="aptName">José María Córdova<small>SKRG · MDE · Rionegro</small></h2>
    <div class="listen" id="listen"></div>
    <p class="note">El audio en vivo lo ofrece ATColombia en su web y app. Este radar usa datos ADS-B comunitarios de adsb.lol.</p>
  </section>
  <section class="sec" id="detail" hidden>
    <p class="eyebrow">Aeronave seleccionada</p>
    <div class="cs" id="dCs">—</div>
    <div class="kv">
      <div><b>Tipo</b><span id="dType">—</span></div>
      <div><b>Matrícula</b><span id="dReg">—</span></div>
      <div><b>Squawk</b><span id="dSq">—</span></div>
      <div><b>Altitud</b><span id="dAlt">—</span></div>
      <div><b>Velocidad</b><span id="dSpd">—</span></div>
      <div><b>Vert.</b><span id="dVs">—</span></div>
    </div>
  </section>
  <p class="eyebrow" style="padding:14px 16px 6px;margin:0" id="countLbl">Tráfico</p>
  <ul id="list"></ul>
</aside>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const AIRPORTS = {
  MDE:{name:"José María Córdova", icao:"SKRG", city:"Rionegro", lat:6.1645, lon:-75.4231, zoom:9.4,
       listen:[["Ver frecuencias de Rionegro","atcolombia.co/aeropuertos/MDE","https://atcolombia.co/aeropuertos/MDE"]]},
  EOH:{name:"Olaya Herrera", icao:"SKMD", city:"Medellín", lat:6.2205, lon:-75.5906, zoom:10,
       listen:[["Ver frecuencias de Olaya Herrera","atcolombia.co/aeropuertos/EOH","https://atcolombia.co/aeropuertos/EOH"]]},
  BOG:{name:"El Dorado", icao:"SKBO", city:"Bogotá", lat:4.7016, lon:-74.1469, zoom:9.4,
       listen:[["Demo gratis: Autorizaciones 121.6","atcolombia.co/#demo","https://atcolombia.co/?landing=1#demo"],
               ["Ver frecuencias de El Dorado","atcolombia.co/aeropuertos/BOG","https://atcolombia.co/aeropuertos/BOG"]]}
};
const RADIUS_NM = 60, REFRESH_MS = 5000;
const PLANE_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#e6edf3" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>';

let current = "MDE", selected = null, timer = null;
const markers = new Map(); // hex -> {marker, el, label}
const $ = id => document.getElementById(id);

const map = new maplibregl.Map({
  container:"map",
  style:"https://tiles.openfreemap.org/styles/liberty",
  center:[AIRPORTS.MDE.lon, AIRPORTS.MDE.lat], zoom:AIRPORTS.MDE.zoom,
  attributionControl:{compact:true}
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}), "top-right");

function ft(a){ return a === "ground" ? "En tierra" : (typeof a === "number" ? a.toLocaleString("es-CO") + " ft" : "—"); }
function km(nm){ return typeof nm === "number" ? (nm*1.852).toFixed(0) + " km" : ""; }

async function getFlights(a){
  const q = `lat=${a.lat}&lon=${a.lon}&dist=${RADIUS_NM}`;
  try {
    const r = await fetch(`/api/vuelos?${q}`, {cache:"no-store"});
    if (r.ok) return await r.json();
  } catch {}
  // Respaldo (por ejemplo, al abrir el archivo sin la función de Vercel)
  const r = await fetch(`https://api.adsb.lol/v2/point/${a.lat}/${a.lon}/${RADIUS_NM}`, {cache:"no-store"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function renderAirport(){
  const a = AIRPORTS[current];
  $("aptName").innerHTML = "";
  $("aptName").append(a.name);
  const s = document.createElement("small"); s.textContent = `${a.icao} · ${current} · ${a.city}`;
  $("aptName").append(s);
  $("listen").replaceChildren(...a.listen.map(([label, short, href]) => {
    const el = document.createElement("a"); el.href = href; el.target = "_blank"; el.rel = "noopener";
    el.append(label); const sp = document.createElement("span"); sp.textContent = "↗"; sp.title = short; el.append(sp);
    return el;
  }));
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-pressed", b.dataset.apt === current));
}

function showDetail(ac){
  if (!ac){ $("detail").hidden = true; return; }
  $("detail").hidden = false;
  $("dCs").textContent = (ac.flight || "").trim() || ac.hex.toUpperCase();
  $("dType").textContent = ac.t || "—";
  $("dReg").textContent = ac.r || "—";
  $("dSq").textContent = ac.squawk || "—";
  $("dAlt").textContent = ft(ac.alt_baro);
  $("dSpd").textContent = typeof ac.gs === "number" ? Math.round(ac.gs) + " kt" : "—";
  const vs = ac.baro_rate ?? ac.geom_rate;
  $("dVs").textContent = typeof vs === "number" ? (vs > 0 ? "+" : "") + vs + " fpm" : "—";
}

function select(hex){
  selected = hex;
  markers.forEach((m, h) => m.el.classList.toggle("sel", h === hex));
  document.querySelectorAll("#list button").forEach(b => b.setAttribute("aria-current", b.dataset.hex === hex));
  const m = markers.get(hex);
  showDetail(m ? m.ac : null);
  if (m) map.easeTo({center:m.marker.getLngLat(), duration:600});
}

function update(data){
  const list = (data.ac || []).filter(ac => typeof ac.lat === "number" && typeof ac.lon === "number");
  const seen = new Set();
  for (const ac of list){
    seen.add(ac.hex);
    let m = markers.get(ac.hex);
    if (!m){
      const el = document.createElement("div"); el.className = "plane"; el.innerHTML = PLANE_SVG;
      el.addEventListener("click", e => { e.stopPropagation(); select(ac.hex); });
      const label = new maplibregl.Marker({element:Object.assign(document.createElement("div"),{className:"lbl"}), anchor:"left"});
      const marker = new maplibregl.Marker({element:el, rotationAlignment:"map"});
      m = {el, marker, label}; markers.set(ac.hex, m);
      marker.setLngLat([ac.lon, ac.lat]).addTo(map);
      label.setLngLat([ac.lon, ac.lat]).addTo(map);
    }
    m.ac = ac;
    m.marker.setLngLat([ac.lon, ac.lat]).setRotation(ac.track ?? ac.true_heading ?? 0);
    m.label.setLngLat([ac.lon, ac.lat]);
    m.label.getElement().textContent = (ac.flight || "").trim() || ac.r || ac.hex.toUpperCase();
    m.el.classList.toggle("sel", ac.hex === selected);
  }
  for (const [hex, m] of markers){ if (!seen.has(hex)){ m.marker.remove(); m.label.remove(); markers.delete(hex); } }

  list.sort((a,b) => (a.dst ?? 999) - (b.dst ?? 999));
  $("countLbl").textContent = `Tráfico · ${list.length} aeronave${list.length === 1 ? "" : "s"} a ${Math.round(RADIUS_NM*1.852)} km`;
  if (!list.length){
    $("list").innerHTML = '<li class="empty">No hay aeronaves reportadas en este momento. La cobertura comunitaria en Colombia es limitada; un receptor propio cerca del aeropuerto la completa.</li>';
  } else {
    $("list").replaceChildren(...list.map(ac => {
      const li = document.createElement("li"), b = document.createElement("button");
      b.type = "button"; b.dataset.hex = ac.hex; b.setAttribute("aria-current", ac.hex === selected);
      const gnd = ac.alt_baro === "ground";
      b.innerHTML = `<span class="c"></span><span class="a${gnd ? " gnd" : ""}"></span><span class="t"></span><span class="d"></span>`;
      b.querySelector(".c").textContent = (ac.flight || "").trim() || ac.hex.toUpperCase();
      b.querySelector(".a").textContent = ft(ac.alt_baro);
      b.querySelector(".t").textContent = [ac.t, ac.r].filter(Boolean).join(" · ") || "Sin datos de tipo";
      b.querySelector(".d").textContent = km(ac.dst);
      b.addEventListener("click", () => select(ac.hex));
      li.append(b); return li;
    }));
  }
  if (selected) showDetail(markers.get(selected)?.ac || null);
}

async function tick(){
  const apt = current;
  try {
    const data = await getFlights(AIRPORTS[apt]);
    if (apt !== current) return;
    update(data);
    $("status").textContent = "Actualizado " + new Date().toLocaleTimeString("es-CO");
  } catch (e) {
    $("status").textContent = "Sin conexión a los datos de vuelo. Reintentando…";
  }
}

function setAirport(code){
  current = code; selected = null; showDetail(null);
  for (const m of markers.values()){ m.marker.remove(); m.label.remove(); }
  markers.clear(); $("list").innerHTML = "";
  const a = AIRPORTS[code];
  map.flyTo({center:[a.lon, a.lat], zoom:a.zoom, duration:1200});
  renderAirport();
  clearInterval(timer); tick(); timer = setInterval(tick, REFRESH_MS);
}

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => setAirport(b.dataset.apt)));
map.on("click", () => select(null));
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
map.on("load", () => setAirport("MDE"));
renderAirport();
</script>
</body>
</html>
